# Bank-PTA method defaults — inherits shared base.
#
# Replaces base PTA's single-mean per-class prototype with a bank of K
# prototypes per class (online k-means style). Motivation: CLIP features
# within a class are multi-modal (e.g. texture orientations on dtd) and a
# single mean is a blurry, poor representative; a K-representative bank
# scored by max-of-K cosine beats the single-mean cosine on all 3 datasets
# (K=3: dtd +12.4pp, flowers +2.1, pets +1.5; K=5: dtd +18.0, flowers +2.4,
# pets +3.0).
#
#   write rule = base PTA multi-class — every class c with
#     softmax(clip_logits)[c] >= 0.1 receives w_c = 1 - exp(-p_c / T)
#     (T from image_level.T, default 20.0);
#   state = K prototypes per class, ALL initialized to the L2-normalized
#     class text embedding (early behavior mirrors PTA); each written
#     feature updates ONLY the nearest prototype:
#     P[c, k*] <- normalize((1 - w_c) * P[c, k*] + w_c * x),
#     k* = argmax_k cos(x, P[c, k]);
#   score = max-of-K cosine: logit_c = max_k cos(x, P[c, k]).
#
# Fusion is an exact mirror of base PTA: final = clip + 100 * logit_c
# (tau_text=1.0, tau_image_proto=100.0, tau_patch_proto=0.0). No patch-level
# signal.
#
# `K` is selected per-run via --override, e.g.:
#   --override K=3
#   --override K=5

defaults:
  - ../base

image_level:
  alpha: 0.01
  T: 20.0

fusion:
  tau_image_proto: 100.0
  tau_patch_proto: 0.0

K: 3
