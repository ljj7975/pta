# Diagnostic PTA method defaults — inherits shared base.

defaults:
  - ../base

patch_level:
  appearance_min_weight: 0.25
  multi_gate: true
  conf_threshold: 0.3
  conf_margin_threshold: 0.00
  aug_copies: 15
  patch_filter_mode: surgery_with_labels          # none | cosine_with_labels | cosine_no_labels | surgery_with_labels | surgery_no_labels

fusion:
  mode: patch_only           # patch_only | image_only
