# GaussCompact-PTA (per-class Gaussian + intra-class compactness gate) —
# combination of the GaussPTA and CompactPTA ideas. Inherits shared base.
#
#   state per class c (float32): mu (L2-norm mean, init = text), v (per-dim
#     variance, init isotropic 1.0), n (effective count, init 0).
#   write rule = base PTA multi-class (w_c = 1 - exp(-p_c / T)); before the
#     Gaussian EMA update, w_c is modulated by the compactness gate on
#     d = 1 - cos(x, mu_c):
#       gate_mode=soft: w_c *= exp(-d^2 / (2 sigma_c^2))
#       gate_mode=hard: w_c = 0 if d > mean_c + hard_k * std_c else w_c
#     then mu_c <- normalize((1-w_c) mu_c + w_c x);
#          v_c  <- (1-w_c) v_c + w_c (x-mu_c)^2; n_c <- n_c + w_c.
#   score = shifted Mahalanobis (variance-aware); fusion = rescaled
#     final = clip + 100 * (logit - max_c logit) (identical to gauss_pta).
#
# gate_mode=off reproduces gauss_pta exactly.
# `shrink` and `gate_mode` selected per-run via --override.

defaults:
  - ../base

image_level:
  alpha: 0.01
  T: 20.0

fusion:
  tau_image_proto: 100.0
  tau_patch_proto: 0.0

shrink: 0.1
gate_mode: soft
sigma_init: 0.1
sigma_min: 0.05
stats_ema: 0.05
hard_k: 0.5
