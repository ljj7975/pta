# Patch-Modulated PTA method defaults — inherits shared base.

defaults:
  - ../base

patch_level:
  conf_margin_threshold: 0.00
  aug_copies: 15
  patch_filter_mode: none          # none | cosine_with_labels | cosine_no_labels | surgery_with_labels | surgery_no_labels
  patch_filter_top_k_ratio: 0.5    # fraction of patches to keep (0 < ratio <= 1.0)
  patch_filter_absolute_threshold: 0.5  # absolute threshold on normalised [0,1] score (takes precedence over top_k_ratio)

fusion:
  tau_image_proto: 80.0
  tau_patch_proto: 20.0
