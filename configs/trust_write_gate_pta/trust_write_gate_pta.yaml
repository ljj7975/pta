# Write-gate PTA method defaults, driven by view-consistency and/or
# prototype-confusability signals (see models/trust_write_gate_pta.py).
#
# Write rule: single-class top-1 EMA (Part 4a mechanism), gated by
# write_gate x signal_source. baseline is signal-independent and always
# writes -- must reproduce the Part 4a top-1-write reference (dtd 46.94 /
# flowers 74.54 / pets 90.86, 4-seed mean).
#
# write_gate / signal_source are overridden per-run via --override, e.g.:
#   --override write_gate=clean signal_source=confusability

defaults:
  - ../base

image_level:
  alpha: 0.01
  T: 20.0

fusion:
  type: WeightedFusion
  tau_text: 1.0
  tau_image_proto: 100.0
  tau_patch_proto: 0.0

write_gate: baseline
signal_source: view
conf_margin_thresh: 0.2
n_views: 4
agreement_thresh: 1.0
confusability_percentile: 66.0
